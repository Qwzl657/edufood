server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:file:./edufood-db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    change-log: classpath:db/changelog/master.yaml

  freemarker:
    template-loader-path: classpath:/templates/
    suffix: .ftlh

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.edufood: DEBUG
    org.springframework.security: INFO